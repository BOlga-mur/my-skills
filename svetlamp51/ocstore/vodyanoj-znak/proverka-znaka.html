// Same as the site: the photo is fitted into a square on white, the mark is scaled to the shorter side and centred
function render(img, size, title) {
  const c = document.createElement('canvas'); c.width = size; c.height = size; c.style.maxWidth = size + 'px';
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
  const s = Math.min(size / img.width, size / img.height), w = img.width * s, h = img.height * s;
  g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
  if (size >= 120) g.drawImage(mark, 0, 0, size, size);
  const f = document.createElement('figure'); f.appendChild(c);
  const cap = document.createElement('figcaption'); cap.textContent = title; f.appendChild(cap);
  return f;
}
document.getElementById('f').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const out = document.getElementById('out'); out.innerHTML = '';
    out.appendChild(render(img, 500, 'Как на странице товара (500×500)'));
    out.appendChild(render(img, 228, 'Как в каталоге (228×228)'));
  };
  img.src = URL.createObjectURL(file);
});
